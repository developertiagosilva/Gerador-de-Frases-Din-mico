<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nível 1 - Frase do Dia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card text-center shadow" style="max-width: 500px; width: 100%;">
        <div class="card-header bg-dark text-white fw-bold">
            🌱 Jornada Django - Nível 1 de 10
        </div>
        <div class="card-body p-4">
            <h5 class="card-title text-secondary font-monospace">"{{ frase }}"</h5>
            <p class="card-text text-muted mt-3">— {{ autor }}</p>
            
            <button onclick="location.reload();" class="btn btn-primary mt-3">
                🔄 Nova Frase (F5)
            </button>
        </div>
        <div class="card-footer text-muted small">
            Página gerada pelo Django às: <strong class="text-danger">{{ hora_atual }}</strong>
        </div>
    </div>

</body>
</html>
